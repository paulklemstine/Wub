name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          # Kit bank (708 MB / 20,670 files) cannot fit the Pages 10-min
          # sync window; it is served straight from the git repo at the
          # pinned commit SHA instead (CORS `*`, range requests verified).
          # Pages ships only the app shell.
          VITE_KIT_BASE: "https://raw.githubusercontent.com/paulklemstine/Wub/${{ github.sha }}/frontend/public/data/kits"
        run: npm run build

      - name: Strip kit bank from Pages artifact
        run: rm -rf frontend/dist/data/kits

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
